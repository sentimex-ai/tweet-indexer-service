app: tweet-indexer-service

# ---------------------------------------------------------------------------
# Legacy subsystems. All off: the service runs with only MongoDB and the
# following scraper. Flip individually if you ever need them back (they also
# need their own infra: Kafka certs in /etc/kafka, grok-py, gRPC peers).
# ---------------------------------------------------------------------------
pipelines:
  tweets: false
  grok: false
  schedulers: false
  grpc: false

admin:
  token: "" # set ADMIN_TOKEN to enable POST /admin/following/scrape

stream:
  kafka:
    enabled: false # KAFKA_ENABLED=true to restore the old producers
    brokers: []
    usePrivate: true
    useSASL: false

memory:
  redis:
    url: ""
    user: default
    password:
    port: 25061
    tls: true

persistence:
  s3:
    bucket: ""
    endpoint: ""
    cdnEndpoint: ""
    forcePathStyle: true
  mongodb:
    url: mongodb://localhost:27017 # MONGODB_URI overrides
    database: tweet-indexer        # MONGODB_DATABASE overrides

services:
  twitterapiservices:
    host: https://api.twitter.com/2/
    bearertoken: "" # TWITTER_TOKEN; unused by the following scraper
  grokapiservices:
    host: grok-py   # only used when pipelines.grok=true

server:
  port: 9090

grpc:
  clients:
    accountableServices:
      host: accountable-services:8080
    saasServices:
      host: saas-services:8080
  server:
    port: 8080

# ---------------------------------------------------------------------------
# x.com web GraphQL client.
#
# Query IDs and feature flags change whenever X ships a web build. When a
# scrape fails with "stale_query" (HTTP 404 / unknown operation) refresh them:
#
#   go run ./cmd/scrape-following discover --account <pool username>
#
# or open x.com/<handle>/following with dev tools -> Network -> filter
# "graphql" -> copy the id from /i/api/graphql/<ID>/Following and the decoded
# `features` query param.
#
# features / fieldToggles / extraVariables are raw JSON strings on purpose
# (viper lower-cases YAML map keys, X's toggles are camelCase).
# If X adds a *required* feature, the client adds it automatically for the
# running process and logs a WARN naming it, so update it here afterwards.
# ---------------------------------------------------------------------------
x:
  baseUrl: https://x.com
  # Public bearer token embedded in the x.com web bundle (same for every
  # visitor). Not an account credential.
  bearer: AAAAAAAAAAAAAAAAAAAAANRILgAAAAAAnNwIzUejRCOuH5E6I8xnZz4puTs%3D1Zv7ttfk8LF81IUq16cHjhLTvJu4FA33AGWWjCpTnA
  # Must match the TLS fingerprint profile (Chrome 133) used by tls-client.
  userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/133.0.0.0 Safari/537.36

  scrape:
    pageSize: 50
    pageDelayMs: 1500
    maxAttemptsPerPage: 6
    maxAccountSwaps: 5
    rateLimitCooldownS: 900
    backoffBaseMs: 2000
    backoffMaxMs: 60000
    leaseTimeoutS: 900
    accountGroup: 0

  ops:
    # Last known-good IDs from the Oct 2025 code. VERIFY with `discover`.
    UserByScreenName:
      queryId: 32pL5BWe9WKeSK1MoPvFQQ
      fieldToggles: '{"withAuxiliaryUserLabels":false}'
      features: >-
        {"hidden_profile_subscriptions_enabled":true,
        "payments_enabled":false,
        "profile_label_improvements_pcf_label_in_post_enabled":true,
        "rweb_tipjar_consumption_enabled":true,
        "responsive_web_graphql_exclude_directive_enabled":true,
        "verified_phone_label_enabled":false,
        "subscriptions_verification_info_is_identity_verified_enabled":true,
        "subscriptions_verification_info_verified_since_enabled":true,
        "highlights_tweets_tab_ui_enabled":true,
        "responsive_web_twitter_article_notes_tab_enabled":true,
        "subscriptions_feature_can_gift_premium":true,
        "creator_subscriptions_tweet_preview_api_enabled":true,
        "responsive_web_graphql_skip_user_profile_image_extensions_enabled":false,
        "responsive_web_graphql_timeline_navigation_enabled":true}

    Following:
      queryId: gsxNGYhRKA6iYYSInE9qew
      extraVariables: '{"includePromotedContent":false}'
      features: >-
        {"rweb_video_screen_enabled":false,
        "payments_enabled":false,
        "profile_label_improvements_pcf_label_in_post_enabled":true,
        "rweb_tipjar_consumption_enabled":true,
        "verified_phone_label_enabled":false,
        "creator_subscriptions_tweet_preview_api_enabled":true,
        "responsive_web_graphql_timeline_navigation_enabled":true,
        "responsive_web_graphql_skip_user_profile_image_extensions_enabled":false,
        "premium_content_api_read_enabled":false,
        "communities_web_enable_tweet_community_results_fetch":true,
        "c9s_tweet_anatomy_moderator_badge_enabled":true,
        "responsive_web_grok_analyze_button_fetch_trends_enabled":false,
        "responsive_web_grok_analyze_post_followups_enabled":true,
        "responsive_web_jetfuel_frame":false,
        "responsive_web_grok_share_attachment_enabled":true,
        "articles_preview_enabled":true,
        "responsive_web_edit_tweet_api_enabled":true,
        "graphql_is_translatable_rweb_tweet_is_translatable_enabled":true,
        "view_counts_everywhere_api_enabled":true,
        "longform_notetweets_consumption_enabled":true,
        "responsive_web_twitter_article_tweet_consumption_enabled":true,
        "tweet_awards_web_tipping_enabled":false,
        "responsive_web_grok_show_grok_translated_post":false,
        "responsive_web_grok_analysis_button_from_backend":true,
        "creator_subscriptions_quote_tweet_preview_enabled":false,
        "freedom_of_speech_not_reach_fetch_enabled":true,
        "standardized_nudges_misinfo":true,
        "tweet_with_visibility_results_prefer_gql_limited_actions_policy_enabled":true,
        "longform_notetweets_rich_text_read_enabled":true,
        "longform_notetweets_inline_media_enabled":true,
        "responsive_web_grok_image_annotation_enabled":true,
        "responsive_web_enhance_cards_enabled":false}
